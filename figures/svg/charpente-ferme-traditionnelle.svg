<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" viewBox="0 0 650 400">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .titre { font-size: 13px; font-weight: bold; fill: #1a1a2e; }
      .label { font-size: 10px; fill: #333; }
      .cote { font-size: 9px; fill: #666; }
      .note { font-size: 9px; fill: #888; font-style: italic; }
      .hachure { fill: url(#hachure_beton); }
      .hachure_bois { fill: url(#hachure_bois); }
      .hachure_sol { fill: url(#hachure_sol); }
      .hachure_isolant { fill: url(#hachure_isolant); }
    </style>
    <pattern id="hachure_beton" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#e8e8e8"/>
      <circle cx="2" cy="2" r="1" fill="#999"/>
      <circle cx="6" cy="6" r="1" fill="#999"/>
    </pattern>
    <pattern id="hachure_bois" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#f5deb3"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#c8a06e" stroke-width="0.5"/>
    </pattern>
    <pattern id="hachure_sol" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#c8b89a"/>
      <line x1="0" y1="4" x2="8" y2="0" stroke="#a0896a" stroke-width="0.7"/>
      <line x1="0" y1="8" x2="8" y2="4" stroke="#a0896a" stroke-width="0.7"/>
    </pattern>
    <pattern id="hachure_isolant" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#fff9c4"/>
      <path d="M0,5 Q2.5,0 5,5 Q7.5,10 10,5" stroke="#f9a825" stroke-width="1" fill="none"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrow_rev" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#555"/>
    </marker>
  </defs>
  <!-- Fond blanc -->
  <rect width="650" height="400" fill="white" stroke="#ccc" stroke-width="1"/>
  <!-- Titre -->
  <text x="325" y="22" text-anchor="middle" class="titre">Ferme de charpente traditionnelle — Vue de face</text>
  <!-- Cadre -->
  <rect x="5" y="5" width="640" height="390" fill="none" stroke="#aaa" stroke-width="0.5"/>
<rect x="65" y="312" width="520" height="16" fill="url(#hachure_bois)" stroke="#8B4513" stroke-width="1.5"/><text x="325" y="345" text-anchor="middle" class="label">Entrait</text><polygon points="75,320 325,120 333,120 87,320" fill="url(#hachure_bois)" stroke="#8B4513" stroke-width="1.5"/><polygon points="575,320 325,120 317,120 563,320" fill="url(#hachure_bois)" stroke="#8B4513" stroke-width="1.5"/><text x="135" y="240" class="label" transform="rotate(-22,135,240)">Arbalétrier</text><text x="515" y="240" class="label" text-anchor="end" transform="rotate(22,515,240)">Arbalétrier</text><rect x="319" y="120" width="12" height="200" fill="url(#hachure_bois)" stroke="#8B4513" stroke-width="1.5"/><text x="345" y="220" class="label">Poinçon</text><line x1="200" y1="320" x2="320" y2="220" stroke="#8B4513" stroke-width="8"/><line x1="450" y1="320" x2="330" y2="220" stroke="#8B4513" stroke-width="8"/><text x="170" y="270" class="label" text-anchor="end">Jambe de force</text><line x1="200" y1="320" x2="105" y2="260" stroke="#8B4513" stroke-width="6" stroke-dasharray="8,3"/><line x1="450" y1="320" x2="545" y2="260" stroke="#8B4513" stroke-width="6" stroke-dasharray="8,3"/><text x="85" y="250" class="cote">Contre-fiche</text><rect x="45" y="320" width="40" height="40" fill="url(#hachure_beton)" stroke="#333" stroke-width="1.5"/><rect x="565" y="320" width="40" height="40" fill="url(#hachure_beton)" stroke="#333" stroke-width="1.5"/><text x="65" y="375" class="label">Sablière</text><text x="585" y="375" class="label">Sablière</text>
  <line x1="75" y1="295" x2="575" y2="295" stroke="#555" stroke-width="0.8" marker-start="url(#arrow_rev)" marker-end="url(#arrow)"/>
  <line x1="75" y1="320" x2="75" y2="295" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="575" y1="320" x2="575" y2="295" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="325.0" y="292.0" text-anchor="middle" class="cote">Portée = 50 m</text>
  <line x1="605" y1="120" x2="605" y2="320" stroke="#555" stroke-width="0.8" marker-start="url(#arrow_rev)" marker-end="url(#arrow)"/>
  <line x1="575" y1="120" x2="605" y2="120" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="575" y1="320" x2="605" y2="320" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="608" y="224.0" class="cote">Flèche = 20 m</text><text x="155" y="305" class="cote">α = 39°</text><text x="325" y="392" text-anchor="middle" class="note">Source : Champly, Nouvelle Encyclopédie Pratique du Bâtiment — Vol.4 Charpentes bois</text></svg>
