565c0" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400" y="80" width="60" height="60" fill="#fce4ec" stroke="#c62828" stroke-width="1"/><text x="430" y="115" text-anchor="middle" class="label">Cuisine</text><circle cx="430" cy="90" r="8" fill="#c62828" stroke="#b71c1c" stroke-width="1"/><text x="465" y="94" class="cote" fill="#c62828">BE</text><rect x="400" y="170" width="60" height="60" fill="#fce4ec" stroke="#c62828" stroke-width="1"/><text x="430" y="205" text-anchor="middle" class="label">SDB</text><circle cx="430" cy="180" r="8" fill="#c62828" stroke="#b71c1c" stroke-width="1"/><text x="465" y="184" class="cote" fill="#c62828">BE</text><rect x="400" y="260" width="60" height="60" fill="#fce4ec" stroke="#c62828" stroke-width="1"/><text x="430" y="295" text-anchor="middle" class="label">WC</text><circle cx="430" cy="270" r="8" fill="#c62828" stroke="#b71c1c" stroke-width="1"/><text x="465" y="274" class="cote" fill="#c62828">BE</text><rect x="400" y="350" width="60" height="60" fill="#fce4ec" stroke="#c62828" stroke-width="1"/><text x="430" y="385" text-anchor="middle" class="label">WC</text><circle cx="430" cy="360" r="8" fill="#c62828" stroke="#b71c1c" stroke-width="1"/><text x="465" y="364" class="cote" fill="#c62828">BE</text><rect x="430" y="60" width="20" height="360" fill="#ffecb3" stroke="#f57f17" stroke-width="1.5"/><text x="440" y="250" text-anchor="middle" class="label" transform="rotate(-90,440,250)">Gaine VMC</text><rect x="390" y="30" width="100" height="40" fill="#fff3e0" stroke="#e65100" stroke-width="2"/><text x="440" y="55" text-anchor="middle" class="label">Caisson VMC</text><line x1="440" y1="30" x2="440" y2="10" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="15" class="cote" fill="#e65100">Rejet air vicié</text><text x="220" y="200" text-anchor="middle" class="cote" fill="#1565c0">→ Flux d'air naturel →</text><text x="220" y="380" text-anchor="middle" class="cote" fill="#1565c0">→ Flux d'air naturel →</text><rect x="60" y="435" width="12" height="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/><text x="78" y="445" class="note">Pièces sèches (EA = Entrée d'Air)</text><rect x="280" y="435" width="12" height="10" fill="#fce4ec" stroke="#c62828" stroke-width="1"/><text x="298" y="445" class="note">Pièces humides (BE = Bouche d'Extraction)</text><text x="290" y="475" text-anchor="middle" class="note">Réf. : DTU 68.3 — Installations de ventilation mécanique contrôlée</text></svg>
