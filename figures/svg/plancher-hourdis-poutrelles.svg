358" y="110" width="24" height="100" fill="url(#hachure_beton)" stroke="#333" stroke-width="1.5"/><rect x="350" y="185" width="40" height="25" fill="url(#hachure_beton)" stroke="#333" stroke-width="1.5"/><circle cx="370" cy="200" r="5" fill="#e53935" stroke="#333" stroke-width="1"/><text x="250" y="230" text-anchor="middle" class="label">Poutrelle béton précontraint</text><rect x="154" y="110" width="72" height="100" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/><line x1="159" y1="120" x2="221" y2="120" stroke="#f9a825" stroke-width="0.5"/><line x1="159" y1="140" x2="221" y2="140" stroke="#f9a825" stroke-width="0.5"/><line x1="159" y1="160" x2="221" y2="160" stroke="#f9a825" stroke-width="0.5"/><line x1="159" y1="180" x2="221" y2="180" stroke="#f9a825" stroke-width="0.5"/><text x="190" y="165" text-anchor="middle" class="cote">Hourdis</text><rect x="274" y="110" width="72" height="100" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/><line x1="279" y1="120" x2="341" y2="120" stroke="#f9a825" stroke-width="0.5"/><line x1="279" y1="140" x2="341" y2="140" stroke="#f9a825" stroke-width="0.5"/><line x1="279" y1="160" x2="341" y2="160" stroke="#f9a825" stroke-width="0.5"/><line x1="279" y1="180" x2="341" y2="180" stroke="#f9a825" stroke-width="0.5"/><text x="310" y="165" text-anchor="middle" class="cote">Hourdis</text><rect x="50" y="80" width="80" height="140" fill="url(#hachure_beton)" stroke="#333" stroke-width="1.5"/><rect x="470" y="80" width="80" height="140" fill="url(#hachure_beton)" stroke="#333" stroke-width="1.5"/><text x="90" y="250" text-anchor="middle" class="label">Mur porteur</text><text x="510" y="250" text-anchor="middle" class="label">Mur porteur</text><line x1="80" y1="270" x2="130" y2="270" stroke="#1565c0" stroke-width="1" marker-start="url(#arrow_rev)" marker-end="url(#arrow)"/><text x="105" y="285" text-anchor="middle" class="cote" fill="#1565c0">Appui ≥ 5 cm</text>
  <line x1="130" y1="60" x2="250" y2="60" stroke="#555" stroke-width="0.8" marker-start="url(#arrow_rev)" marker-end="url(#arrow)"/>
  <line x1="130" y1="80" x2="130" y2="60" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="250" y1="80" x2="250" y2="60" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="190.0" y="57.0" text-anchor="middle" class="cote">Entraxe = 60 cm</text>
  <line x1="500" y1="80" x2="500" y2="210" stroke="#555" stroke-width="0.8" marker-start="url(#arrow_rev)" marker-end="url(#arrow)"/>
  <line x1="470" y1="80" x2="500" y2="80" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="470" y1="210" x2="500" y2="210" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="503" y="149.0" class="cote">H = 20 cm</text><text x="80" y="320" class="cote" font-weight="bold">Légende :</text>
  <rect x="80" y="332" width="12" height="10" fill="url(#hachure_beton)" stroke="#999" stroke-width="0.5"/>
  <text x="96" y="340" class="note">Béton armé</text>
  <rect x="220" y="332" width="12" height="10" fill="#fff9c4" stroke="#999" stroke-width="0.5"/>
  <text x="236" y="340" class="note">Hourdis polystyrène</text><circle cx="370" cy="332" r="5" fill="#e53935" stroke="#333" stroke-width="1"/><text x="386" y="337" class="note">Armatures précontraintes</text><text x="300" y="372" text-anchor="middle" class="note">Source : Champly, Nouvelle Encyclopédie Pratique du Bâtiment — Vol.1 Arpentage, Fondations</text></svg>
