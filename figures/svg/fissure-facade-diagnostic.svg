oke="#7b1fa2" stroke-width="1" stroke-dasharray="3,2"/><rect x="75" y="340" width="70" height="50" fill="#b3e5fc" stroke="#0288d1" stroke-width="1"/><text x="110" y="368" text-anchor="middle" class="cote" fill="#0288d1">Baie</text><path d="M75,340 Q110,310 180,340" stroke="#1565c0" stroke-width="2.5" fill="none"/><path d="M80,340 Q110,315 175,340" stroke="#1565c0" stroke-width="1" fill="none" stroke-dasharray="3,2"/><line x1="220" y1="350" x2="340" y2="350" stroke="#c62828" stroke-width="3"/><ellipse cx="225" cy="350" rx="8" ry="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.7"/><ellipse cx="245" cy="350" rx="8" ry="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.7"/><ellipse cx="265" cy="350" rx="8" ry="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.7"/><ellipse cx="285" cy="350" rx="8" ry="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.7"/><ellipse cx="305" cy="350" rx="8" ry="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.7"/><ellipse cx="325" cy="350" rx="8" ry="5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" opacity="0.7"/><text x="280" y="375" text-anchor="middle" class="cote" fill="#c62828">Gonflement</text><line x1="390" y1="430" x2="510" y2="290" stroke="#2e7d32" stroke-width="2.5"/><line x1="400" y1="430" x2="510" y2="300" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3,2"/><text x="310" y="435" text-anchor="middle" class="cote" font-weight="bold">Gravité : trait plein = fissure active / tirets = fissure stabilisée</text><text x="310" y="450" text-anchor="middle" class="note">Source : AQC — Observatoire de la Qualité de la Construction 2026 + Champly Vol.2</text></svg>
